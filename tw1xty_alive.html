document.addEventListener('visibilitychange',function(){if(!document.hidden&&!asleep&&!fl){squash();mood('sur');say('О, вернулся! А я не скучал. Совсем. Ни капли.')}});
var rw=innerWidth,rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(Math.abs(innerWidth-rw)>40&&!asleep&&!fl){mood('ang');say('Эй, не мни мне дом!')}rw=innerWidth},400)});
addEventListener('contextmenu',function(){if(asleep||fl)return;mood('sus');say('Правый клик? Смело. Тут нечего смотреть.')});
/* time on site */
[[40000,'Ты тут уже 40 секунд. Либо нравится, либо забыл(а) закрыть.'],[100000,'Ты тут живёшь? Могу сдать комнату 🏠'],[240000,'Четыре минуты. Это уже отношения.']].forEach(function(a){setTimeout(function(){if(!asleep&&!fl&&!document.hidden){mood('sur');say(a[1])}},a[0])});

/* ===== ALIVE PACK ===== */
var emT=0,wokeT=0,rcT=0,rcK={},rcI={};
function busy(){return bz||asleep||fl||dragged||tkd||Date.now()-wokeT<1800}
function emote(e){var r=M.getBoundingClientRect(),n=document.createElement('span');n.textContent=e;n.style.cssText='position:fixed;z-index:80;font-size:30px;pointer-events:none;left:'+(r.left+r.width/2-14+(Math.random()*40-20))+'px;top:'+(r.top+4)+'px';document.body.appendChild(n);n.animate([{transform:'translateY(0) scale(.3)',opacity:0},{transform:'translateY(-30px) scale(1.15)',opacity:1,offset:.3},{transform:'translateY(-75px) scale(1)',opacity:0}],{duration:1300,easing:'ease-out'}).onfinish=function(){n.remove()}}
function react(k,L,cd,m,em){var n=Date.now();if(busy()||n-rcT<1500||n-(rcK[k]||0)<(cd||8000))return false;rcT=n;rcK[k]=n;var i=(rcI[k]=(rcI[k]||0)+1);say(L[(i-1)%L.length]);if(m)mood(m);if(em)emote(em);return true}
function wave(){if(asleep||fl)return;M.classList.add('wv');setTimeout(function(){M.classList.remove('wv')},2000)}
function roll(ms){PU.classList.add('roll');setTimeout(function(){PU.classList.remove('roll')},ms||2300)}
['tg','vpn','dc'].forEach(function(k){$(k).addEventListener('click',wave)});
setTimeout(wave,2400);
/* micro life: pupil jitter, ear twitch, self-talk */
setInterval(function(){PU.style.translate=((Math.random()*2-1)*2)+'px '+((Math.random()*2-1)*2)+'px'},650);
(function tw(){setTimeout(function(){if(!asleep&&!fl){var e=document.querySelector('.ear.'+(Math.random()<.5?'l':'r')),d=e.classList.contains('l')?-1:1;e.animate([{transform:'rotate('+d*18+'deg)'},{transform:'rotate('+d*40+'deg)'},{transform:'rotate('+d*12+'deg)'},{transform:'rotate('+d*18+'deg)'}],{duration:420})}tw()},3500+Math.random()*4500)})();
var MON=['Так… считаю пиксели. Один, два…','Интересно, как там утки?','Я бы что-нибудь съел. Но у меня нет рта. Ой, есть.','Если долго смотреть на экран, экран смотрит в ответ. Я в курсе.','*напевает* ту-ту-ру…','Кто-то должен тут работать. Это я. Видишь, работаю?','Мне кажется, или ссылки сегодня особенно красивые?'],mnT=0;
setInterval(function(){var i=Date.now()-last;if(!busy()&&i>3500&&i<9500&&Date.now()-mnT>16000&&Math.random()<.08){mnT=Date.now();say(MON[Math.floor(Math.random()*MON.length)]);emote('💭');wave2()}},1000);
function wave2(){if(Math.random()<.4)wave()}
/* shake the mouse -> dizzy */
var lx,ly,lt,mvs=0,dzT=0;
addEventListener('pointermove',function(e){var n=performance.now();if(lt&&n>lt){if(Math.hypot(e.clientX-lx,e.clientY-ly)/(n-lt)*1000>2800)mvs++}lx=e.clientX;ly=e.clientY;lt=n;if(mvs>=8){mvs=0;if(!busy()&&Date.now()-dzT>9000){dzT=Date.now();roll(2600);M.classList.add('hold');setTimeout(function(){M.classList.remove('hold')},1500);mood('sur');emote('💫');say('Ты чего трясёшь?! Голова кружится!')}}},{passive:true});
setInterval(function(){mvs=Math.max(0,mvs-3)},700);
/* scroll, name, footer, selection, copy */
addEventListener('scroll',function(){if(react('sc',['Укачивает, когда ты так листаешь.','Куда ты уезжаешь? Тут всё на месте.'],12000,'sur','💫'))roll(1800)},{passive:true});
$('nm').addEventListener('pointerenter',function(){lookEl($('nm'));react('nm',['Это моё имя. Красивое, да?','Опять смотришь на имя. Оно такое одно.'],15000,'sur')});
$('ft').addEventListener('pointerenter',function(){lookEl($('ft'));react('ft',['Это таймер. Не смотри на него. Он расстраивает.'],20000,'sad','💧')});
document.addEventListener('selectionchange',function(){if(String(getSelection()).length>3)react('sel',['Выделяешь меня? Я не текст. Я существо.'],12000,'sus')});
addEventListener('copy',function(){react('cp',['Скопировал? Ну-ну. Я всё видел.'],10000,'sus','👀')});
/* click on empty space */
var ec=0,ecT=0,EL=['Ты куда тыкаешь? Там ничего нет.','Там пусто. Я проверял.','Кликай по мне, я интереснее.','Опять мимо. Прицел сбит?'];
addEventListener('pointerdown',function(e){var t=e.target;if(t.closest&&t.closest('.lk,.bt,#ms,#fp,#ft,.ch,.toast'))return;var n=Date.now();if(busy()||n-ecT<1300)return;ecT=n;ec++;emote('❓');if(ec%5===0)say('Ладно, там реально ничего нет. Сдаюсь.');else say(EL[(ec-1)%EL.length])});
/* double click: backflip */
M.addEventListener('dblclick',function(){if(asleep||fl)return;M.querySelector('.fl').animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY(-70px) rotate(180deg)',offset:.5},{transform:'translateY(0) rotate(360deg)'}],{duration:760,easing:'cubic-bezier(.3,1.2,.6,1)'});emote('🌀');say('Кувырок! Я вообще-то не для этого создан.')});
/* petting -> shy */
var shT;M.addEventListener('pointerenter',function(e){if(e.pointerType!=='mouse')return;clearTimeout(shT);shT=setTimeout(function(){if(!busy()){look(0,-400);mood('shy',3500);say('Эм… приятно. Не останавливайся. Нет, остановись.')}},1600)});
M.addEventListener('pointerleave',function(){clearTimeout(shT)});
/* link hover nudge */
var NG={tg:'Ну нажимай уже. Я тут не вечный.',vpn:'Ты там выбираешь или завис?',dc:'Нажми, он сам себя не скопирует.'},ngT;
Object.keys(NG).forEach(function(k){$(k).addEventListener('pointerenter',function(){clearTimeout(ngT);ngT=setTimeout(function(){react('ng'+k,[NG[k]],25000,'sus','⏳')},4200)});$(k).addEventListener('pointerleave',function(){clearTimeout(ngT)})});
/* keyboard, network, orientation */
var kf=0;addEventListener('keydown',function(e){if(e.key==='Escape')react('esc',['Escape не работает. Выйти можно только закрыв вкладку. Ты же не посмеешь.'],20000,'sus');else if(!kf&&e.key.length===1){kf=1;setTimeout(function(){react('key',['Ты печатаешь?! Мне? Я весь внимание.'],1e9,'sur')},700)}});
addEventListener('offline',function(){mood('sad',0);emote('😱');say('Интернет пропал! Я один во тьме!!')});
addEventListener('online',function(){mood('sur');say('Интернет вернулся. Я не боялся. Совсем.')});
addEventListener('orientationchange',function(){roll(2000);react('or',['Меня повернули! Голова кружится.'],5000,'sur','🌀')});
/* clingy tab title */
var GT=['Ты куда? 🥺','Я уже поставил чайник…','Ладно. Иди. Я не обижаюсь. (обижаюсь)','Вернись, мне скучно 👁️'],gi=0,gt,ot=document.title;
document.addEventListener('visibilitychange',function(){clearInterval(gt);if(document.hidden){document.title=GT[gi++%GT.length];gt=setInterval(function(){document.title=GT[gi++%GT.length]},2500)}else document.title=ot});
})();
</script></body></html>
